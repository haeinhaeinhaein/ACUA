<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACUA AI Curator for Unknown Arts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="site-header">
      <button id="homeLink" class="logo" type="button" aria-label="홈으로 이동">ACUA</button>
      <nav class="menu">
        <a id="aboutLink" href="#" aria-label="About ACUA">About</a>
        <a id="archiveLink" href="#" aria-label="View Archive">Archive</a>
      </nav>
    </header>

    <main class="main-content">
      <section id="uploadSection" class="upload-section">
        <label for="fileInput" id="dropZone" class="drop-zone" tabindex="0" role="button" aria-label="작품 이미지 업로드">
          <span>Present Artwork</span>
        </label>
        <input type="file" id="fileInput" accept="image/*" />
      </section>

      <section id="loadingSection" class="loading-section hidden" aria-live="polite">
        <p id="stageText" class="stage-text">구도 분석 중<span class="dots"></span></p>
        <div class="progress-track" aria-hidden="true">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </section>

      <section id="resultSection" class="result-section hidden">
        <div class="result-grid">
          <article class="artwork-panel">
            <img id="uploadedImage" alt="Uploaded artwork preview" />
          </article>

          <article class="report-panel">
            <h1>ACUA&apos;s Report</h1>
            <p id="professionalComment" class="professional-comment"></p>

            <section class="metrics">
              <div id="metricList"></div>
            </section>

            <section class="analysis-body">
              <p id="analysisText"></p>
              <p id="comparisonText"></p>
            </section>

            <section class="valuation">
              <p><strong>평점:</strong> <span id="scoreText"></span></p>
              <p><strong>예상 감정가:</strong> <span id="valueText"></span></p>
            </section>

            <button id="resetButton" class="reset-button" type="button">Analyze New Artwork</button>
          </article>
        </div>
      </section>

      <section id="archiveSection" class="archive-section hidden">
        <div class="archive-header-row">
          <h2>Archive</h2>
          <button id="archiveBackButton" class="archive-back-button" type="button">Back to Upload</button>
        </div>
        <p id="archiveEmptyText" class="archive-empty-text">저장된 분석 기록이 없습니다.</p>
        <div id="archiveList" class="archive-list"></div>
      </section>
    </main>

    <footer class="site-footer">© 2026 ACUA Art Analysis System</footer>
  </div>

  <div id="aboutModal" class="about-modal hidden" role="dialog" aria-modal="true" aria-labelledby="aboutTitle">
    <div class="about-modal-backdrop" data-about-close="backdrop"></div>
    <article class="about-modal-panel">
      <button id="aboutCloseButton" class="about-modal-close" type="button" aria-label="Close about modal">×</button>
      <h2 id="aboutTitle"><span class="about-title-main">ACUA</span> <span class="about-title-sub">(AI Curator for Unknown Arts)</span></h2>
      <p>
        ACUA는 예술의 주관성을 데이터의 냉철함으로 해체하는 디지털 도슨트입니다.<br />
        우리는 감상이라는 모호한 영역을 형이상학적 알고리즘을 통해
        수치화하며, 작품의 본질적 층위를 픽셀 단위로 분석합니다.
      </p>
      <p><em>"당신의 예술은 해석될 준비가 되었습니까?"</em></p>
    </article>
  </div>

  <script src="script.js"></script>
</body>
</html>
